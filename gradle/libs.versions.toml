[versions]
# Система сборки и компилятор
gradle = "9.7.1"
agp = "9.5.0-alpha04"
kotlin = "2.4.20-RC3"

# AndroidX Core, Lifecycle и Compose
core-ktx = "1.15.0"
compose-bom = "2026.08.00"
activity-compose = "1.14.0-alpha01"
compose-material3-standalone = "1.5.0-alpha27"

# Асинхронность, сеть и сериализация
coroutines = "1.11.0"
serialization = "1.12.0-RC"
ktor = "3.5.2"

# Безопасность и хранилище ключей Knox Vault
security-crypto = "1.1.0"

# Google Gemini API
gemini-model = "gemini-3.8-flash"

[libraries]
# --- Core Android ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# --- Jetpack Compose UI ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3-standalone" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- Kotlinx & Сериализация ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- Ktor HTTP Client (CIO движок для прямого SSE) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# --- Безопасность и аппаратное шифрование (Samsung Knox Vault) ---
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }